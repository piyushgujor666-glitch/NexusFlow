name: NexusFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Run backend unit tests
        working-directory: server
        run: npm test

  frontend:
    name: Frontend tests and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: client
        run: npm install --no-audit --no-fund
      - name: Run graph serialization tests
        working-directory: client
        run: npm test
      - name: Build React dashboard
        working-directory: client
        run: npm run build
